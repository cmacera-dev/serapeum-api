version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    # Kept high on purpose: when this queue fills, Dependabot silently stops opening
    # PRs for everything else, including security-relevant bumps. A single PR that can
    # never merge is enough to starve the queue, so anything permanently blocked belongs
    # in `ignore` below rather than sitting open.
    open-pull-requests-limit: 10
    # A freshly published version is the riskiest one to take: a compromised release is
    # usually caught within days. This waits before *proposing* an update — it applies to
    # version updates only, so security updates still arrive immediately.
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # Blocked by genkit pinning zod@^3.x — tracked in check-dependency-blockers.yml
      - dependency-name: "zod"
        versions: ["4.x", ">=4"]
      - dependency-name: "@asteasolutions/zod-to-openapi"
        versions: ["8.x", ">=8"]
      # 1.x declares peerOptional zod@^4, which npm still enforces against our zod 3, so
      # npm ci fails with ERESOLVE (PR #395). Lifts with the zod blocker above.
      - dependency-name: "@tavily/core"
        versions: [">=1"]
      # Blocked by genkit pinning @opentelemetry/sdk-node@^0.52 (sdk-trace-base@1.25)
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.53"]
      - dependency-name: "@opentelemetry/sdk-trace-node"
        versions: [">1.25.x"]
      # Blocked by every @opentelemetry/sdk-trace-node release, 2.x included, declaring
      # peer @opentelemetry/api@">=1.0.0 <1.10.0"; npm ci fails with ERESOLVE (PR #370).
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      # Blocked by @typescript-eslint declaring peer typescript@">=4.8.4 <6.1.0";
      # npm ci fails with ERESOLVE until that range is widened for TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Held at the Node major this project actually runs (engines.node, and node-version
      # in ci.yml). Newer type definitions describe APIs that do not exist on the runtime,
      # so tsc would happily accept code that crashes in production. Raise this in step
      # with the runtime, not ahead of it — check:blockers flags the mismatch.
      - dependency-name: "@types/node"
        versions: [">=23"]
    reviewers:
      - "cmacera"
    labels:
      - "dependencies"
      - "automated"
    # `include: scope` makes Dependabot append its own scope — `(deps)` for production and
    # `(deps-dev)` for development — so the prefix has to be the bare type. Paired with
    # `prefix: "chore(deps)"` the two combined into `chore(deps)(deps): bump jose ...`, which
    # is not a Conventional Commit. Nothing caught it: the title check skips Dependabot, and
    # auto-merge squashes the title into the commit message, so five of them are already on
    # main (#282 through #286).
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group all non-breaking updates together
      genkit:
        patterns:
          - "@genkit-ai/*"
          - "genkit*"
      # vitest, @vitest/coverage-v8 and @vitest/ui peer-depend on each other at the same
      # major version. Left ungrouped, a major bump lands as three separate PRs that each
      # break `npm ci` with ERESOLVE because the other two stay behind. No update-types
      # restriction here on purpose, so majors are grouped too, not just minor/patch.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # One PR for every other minor and patch bump, production and development alike.
      # `main` requires branches to be up to date before merging, so each merged PR leaves
      # every other open one BEHIND, and Dependabot only rebases on a conflict: four PRs
      # opened together merged one rebase at a time. Fewer PRs is fewer of those waits.
      # Majors stay out on purpose — each needs its own review and auto-merge skips them.
      # A dependency joins the first group that matches it, so genkit and vitest keep theirs.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    # Same reason as the npm `minor-and-patch` group: one PR instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
