version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    # Kept high on purpose: when this queue fills, Dependabot silently stops opening
    # PRs for everything else, including security-relevant bumps. A single PR that can
    # never merge is enough to starve the queue, so anything permanently blocked belongs
    # in `ignore` below rather than sitting open.
    open-pull-requests-limit: 10
    # A freshly published version is the riskiest one to take: a compromised release is
    # usually caught within days. This waits before *proposing* an update — it applies to
    # version updates only, so security updates still arrive immediately.
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # Blocked by genkit pinning zod@^3.x — tracked in check-dependency-blockers.yml
      - dependency-name: "zod"
        versions: ["4.x", ">=4"]
      - dependency-name: "@asteasolutions/zod-to-openapi"
        versions: ["8.x", ">=8"]
      # Blocked by genkit pinning @opentelemetry/sdk-node@^0.52 (sdk-trace-base@1.25)
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.53"]
      - dependency-name: "@opentelemetry/sdk-trace-node"
        versions: [">1.25.x"]
      # Blocked by @typescript-eslint declaring peer typescript@">=4.8.4 <6.1.0";
      # npm ci fails with ERESOLVE until that range is widened for TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Held at the Node major this project actually runs (engines.node, and node-version
      # in ci.yml). Newer type definitions describe APIs that do not exist on the runtime,
      # so tsc would happily accept code that crashes in production. Raise this in step
      # with the runtime, not ahead of it — check:blockers flags the mismatch.
      - dependency-name: "@types/node"
        versions: [">=23"]
    reviewers:
      - "cmacera"
    labels:
      - "dependencies"
      - "automated"
    # `include: scope` makes Dependabot append its own scope — `(deps)` for production and
    # `(deps-dev)` for development — so the prefix has to be the bare type. Paired with
    # `prefix: "chore(deps)"` the two combined into `chore(deps)(deps): bump jose ...`, which
    # is not a Conventional Commit. Nothing caught it: the title check skips Dependabot, and
    # auto-merge squashes the title into the commit message, so five of them are already on
    # main (#282 through #286).
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group all non-breaking updates together
      genkit:
        patterns:
          - "@genkit-ai/*"
          - "genkit*"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
