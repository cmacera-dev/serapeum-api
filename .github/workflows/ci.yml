name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege, declared explicitly: the repo default is currently `read`, but a
# change to that default must not silently widen what these workflows can do.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Catches lockfile entries pruned by `npm install` on macOS, which resolve fine
      # locally and then break `npm ci` here. See scripts/check-lockfile.ts.
      - name: Check lockfile integrity
        run: npm run check:lockfile

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      # Not part of `test:run`, and it cannot be: `tests/setup-genkit.ts` mocks
      # `ai.defineFlow` down to the implementation function, so a flow under vitest has no
      # `run` and Genkit's `expressHandler` cannot dispatch it — every request that reaches a
      # flow *body* answers 500 regardless of what is being asserted. The vitest companion
      # covers the input-gate rejections, which are answered before dispatch; this harness
      # boots real flows against loopback stand-ins and covers the other half: that a body the
      # schema accepts still runs the flow, and that a genuine fault inside one is still a
      # logged 500. Leaving it out of CI is what #274 taught us not to do — the unit tests
      # asserted the thrown error and stayed green while every rejection came back as 500.
      - name: Run flow input-gate harness
        run: npm run test:e2e:flow-input

      - name: Build
        run: npm run build

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # Dependabot tells you about a vulnerable dependency after it is already in the tree.
  # This refuses the pull request that would introduce one. Only meaningful on PRs, since
  # it diffs the manifest against the base branch.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # Every advisory on this repo is transitive and pinned through `overrides`;
          # failing on moderate would block every PR on issues that are already handled.
          comment-summary-in-pr: on-failure
