name: "Check PR Title"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  check-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            if (context.payload.pull_request.user.login === 'dependabot[bot]') {
              console.log('Skipping title check for Dependabot-authored PR.');
              return;
            }
            const title = context.payload.pull_request.title;
            const types = 'feat|fix|chore|refactor|docs|test|style|perf|ci|build|revert';
            const regex = new RegExp(`^(${types})(\\([^)]+\\))?!?: .+`);
            if (!regex.test(title)) {
              core.setFailed(`PR title "${title}" must follow Conventional Commits, e.g. "fix(api): correct pagination". Issues are linked with "Closes #123" in the body, not with a title prefix.`);
            }
