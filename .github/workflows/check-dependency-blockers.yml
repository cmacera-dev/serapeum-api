name: Check dependency blockers

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9:00 UTC
  workflow_dispatch:

# The logic lives in scripts/check-dependency-blockers.ts, not here, so adding a new
# blocker is one object in a list instead of another copy-pasted step.
jobs:
  check-blockers:
    name: Check blockers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reads advisories from `npm audit`, so no token is needed here. The Dependabot
      # alerts API rejects GITHUB_TOKEN outright, and requiring a PAT to see your own
      # vulnerabilities is a mechanism that breaks the day the PAT expires.
      - name: Check blockers, overrides and advisories
        id: check
        run: npm run check:blockers

      - name: Publish report to the run summary
        run: cat "${{ steps.check.outputs.report_file }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the status issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ACTIONABLE: ${{ steps.check.outputs.actionable }}
          REPORT_FILE: ${{ steps.check.outputs.report_file }}
        with:
          script: |
            const fs = require('fs');

            const TITLE = 'Dependency blockers & security status';
            const LABEL = 'dependency-status';

            const body = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            const actionable = process.env.ACTIONABLE === 'true';

            // One issue, reused forever: it opens when there is work and closes itself when
            // there is not, so the repo never accumulates a pile of stale blocker issues.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [LABEL],
              state: 'all',
              per_page: 100,
            });

            const issue = existing.find((candidate) => candidate.title === TITLE);

            if (issue === undefined) {
              if (!actionable) {
                core.info('Nothing actionable and no issue to update.');
                return;
              }
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                labels: [LABEL, 'dependencies'],
                body,
              });
              core.info(`Opened #${created.number}.`);
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: actionable ? 'open' : 'closed',
              body,
            });

            if (!actionable && issue.state === 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Everything here has been dealt with. Closing until the next blocker lifts.',
              });
            }

            core.info(`Updated #${issue.number} (actionable: ${actionable}).`);
